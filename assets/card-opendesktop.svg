<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240">
<defs><clipPath id="c"><rect width="600" height="240" rx="16"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="600" height="240" fill="#1c1917"/><rect width="600" height="6" fill="#b3d1ed"/></g>
<text x="36" y="72" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f4ead4">OpenWorker</text>
<text x="36" y="116" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a29e">Self-hosted desktop agents. Each worker gets</text>
<text x="36" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a29e">its own sandboxed computer and keeps its state.</text>
<rect x="28" y="178" width="544" height="38" rx="8" fill="#262220"/>
<text x="44" y="203" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#b3d1ed">$ <tspan fill="#d6d3d1">docker compose up -d server dashboard</tspan></text>
</svg>